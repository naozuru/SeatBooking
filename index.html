<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo -->
    <link rel="icon" href="assets/logo_gold.png" type="image/x-icon" />

    <title>Tunas Mekar Indonesia | Theater Seat Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="app-header">
      <div class="header-left">
        <img
          src="assets/logo_gold.png"
          alt="Logo Tunas Mekar Indonesia"
          class="logo"
        />
        <span class="title">Theater Seat Booking System</span>
      </div>
    </header>

    <!-- LOGIN -->
    <div id="loginBox" class="login-wrapper">
      <div class="login-card">
        <img src="assets/logo_gold.png" class="login-logo" alt="Logo" />

        <h2>Login Sistem</h2>
        <p class="login-sub">Theater Seat Booking System</p>

        <select id="level">
          <option value="">Pilih Level</option>
          <option value="ECC">ECC</option>
          <option value="ES">ES</option>
          <option value="JHS">JHS</option>
          <option value="SHS">SHS</option>
        </select>

        <input id="username" placeholder="Username" />
        <div class="password-wrapper">
          <input id="password" type="password" placeholder="Password" />
          <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>

        <button id="loginBtn" onclick="login()">
          <span class="btn-text">Masuk</span>
          <span class="spinner"></span>
        </button>
        <div id="loginError" class="login-error"></div>

        <div class="login-footer">© 2026 Tunas Mekar Indonesia</div>
      </div>
    </div>

    <!-- SEAT -->
    <div id="seatBox" class="box">
      <h2>Pilih Kursi</h2>
      <div id="userInfo"></div>

      <!-- STAGE -->
      <div class="stage">🎤 STAGE / PODIUM</div>

      <!-- LEGEND -->
      <div class="legend">
        <div><span class="seat"></span> Kosong</div>
        <div><span class="seat selected"></span> Dipilih</div>
        <div><span class="seat vip"></span> VIP</div>
        <div><span class="seat mine"></span> Kursi Saya</div>
        <div><span class="seat booked"></span> Terisi</div>
      </div>

      <!-- SEAT MAP -->
      <div class="seat-map-wrapper">
        <div class="row-labels" id="rowLabels"></div>
        <div id="seatMap" class="seat-map"></div>
      </div>

      <button onclick="submitSeats()">Booking Kursi</button>
    </div>

    <footer>© <span>2026</span> Mr Rayhan. All rights reserved.</footer>

    <script>
      const WEBAPP_URL =
        "https://script.google.com/macros/s/AKfycbywF2ukc70n1LwtUBykZ-kOGKyZuLSS4Nq5dRJSjGHG2Tm9kwFftQuS7xcdQtrDnLDa/exec";

      let userData = null;
      let selectedSeats = [];
      let config = {};

      // Password Hide
      function togglePassword() {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
      }

      // Login error
      function showError(msg) {
        document.getElementById("loginError").innerText = msg;
      }

      function clearError() {
        document.getElementById("loginError").innerText = "";
      }

      // Animasi Fade
      function animateOutLogin() {
        document.querySelector(".login-card").classList.add("fade-out");
      }

      /* LOGIN */
      async function login() {
        clearError(); // hapus error lama

        const levelEl = document.getElementById("level");
        const usernameEl = document.getElementById("username");
        const passwordEl = document.getElementById("password");
        const btn = document.getElementById("loginBtn");

        const level = levelEl.value;
        const username = usernameEl.value.trim();
        const password = passwordEl.value.trim();

        // VALIDASI
        if (!level || !username || !password) {
          showError("Level, username, dan password wajib diisi");
          return;
        }

        // LOADING
        btn.classList.add("loading");
        btn.disabled = true;

        try {
          const res = await fetch(WEBAPP_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "login",
              level,
              username,
              password,
            }),
          });

          const data = await res.json();

          if (!data.success) {
            showError(data.message || "Login gagal");
            return;
          }

          // SIMPAN USER
          userData = data;

          // ANIMASI KELUAR LOGIN
          document.getElementById("loginBox").classList.add("fade-out");

          setTimeout(async () => {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("seatBox").style.display = "block";

            document.getElementById(
              "userInfo"
            ).innerText = `${data.fullname} | Max Seat: ${data.max_seat}`;

            await loadConfig();
            loadSeats();
          }, 400);
        } catch (err) {
          showError("Koneksi ke server bermasalah");
        } finally {
          btn.classList.remove("loading");
          btn.disabled = false;
        }
      }

      /* LOAD CONFIG */
      async function loadConfig() {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "config" }),
        });
        config = await res.json();
      }

      function isVIP(seatCode) {
        if (!config.VIP_LIST) return false;
        return config.VIP_LIST.includes(seatCode);
      }

      /* LOAD SEATS */
      async function loadSeats() {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "seatmap" }),
        });

        const booked = await res.json();
        const seatMap = document.getElementById("seatMap");
        const rowLabels = document.getElementById("rowLabels");

        const rows = parseInt(config.ROWS);
        const cols = parseInt(config.COLUMNS);
        const aisle = parseInt(config.AISLE_COLUMN);

        const totalCols = cols + 1;

        seatMap.innerHTML = "";
        rowLabels.innerHTML = "";

        seatMap.style.gridTemplateColumns = `repeat(${totalCols}, 44px)`;

        for (let r = 0; r < rows; r++) {
          const rowLetter = String.fromCharCode(65 + r);

          const lbl = document.createElement("div");
          lbl.className = "row-label";
          lbl.innerText = rowLetter;
          rowLabels.appendChild(lbl);

          for (let c = 1; c <= totalCols; c++) {
            // AISLE
            if (c === aisle) {
              const aisleEl = document.createElement("div");
              aisleEl.className = "aisle";
              seatMap.appendChild(aisleEl);
              continue;
            }

            const realCol = c > aisle ? c - 1 : c;
            const seatCode = rowLetter + realCol;

            const seat = document.createElement("div");
            seat.className = "seat";
            seat.innerText = seatCode;

            // ⭐ VIP — PALING ATAS & FINAL
            if (isVIP(seatCode)) {
              seat.classList.add("vip");
              seat.innerText = "⭐";
              seat.title = seatCode + " (VIP)";
              seat.style.cursor = "not-allowed";
              seat.style.pointerEvents = "none";
            }

            // 🔒 BOOKED
            else if (booked[seatCode]) {
              if (booked[seatCode].username === userData.username) {
                seat.classList.add("mine");
                seat.title = "Your Seat";
              } else {
                seat.classList.add("booked");
                seat.innerText = "✖";
                seat.title = seatCode + " (Booked)";
              }
            }

            // ✅ NORMAL
            else {
              seat.onclick = () => toggleSeat(seatCode, seat);
            }

            seatMap.appendChild(seat);
          }
        }
      }

      /* TOGGLE */
      function toggleSeat(code, el) {
        if (selectedSeats.includes(code)) {
          selectedSeats = selectedSeats.filter((s) => s !== code);
          el.classList.remove("selected");
          return;
        }

        if (selectedSeats.length >= userData.max_seat) {
          alert("Maksimal kursi: " + userData.max_seat);
          return;
        }

        selectedSeats.push(code);
        el.classList.add("selected");
      }

      /* SUBMIT */
      async function submitSeats() {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "book",
            level: userData.level,
            username: userData.username,
            seats: selectedSeats,
          }),
        });

        const data = await res.json();
        if (!data.success) return alert(data.message);

        alert("Berhasil booking!");
        location.reload();
      }
    </script>
  </body>
</html>
