<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Logo -->
    <link rel="icon" href="assets/logo_gold.png" type="image/x-icon" />

    <title>Tunas Mekar Indonesia | Theater Seat Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      :root {
        --bg: #003f33;
        --card: #1e293b;
        --primary: #22c55e;
        --danger: #ef4444;
        --seat: #334155;
        --selected: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #fff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* HEADER */
      header {
        background: #020617;
        padding: 14px 20px;
        text-align: center;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      /* FOOTER */
      footer {
        margin-top: auto;
        background: #020617;
        padding: 10px;
        text-align: center;
        font-size: 13px;
        opacity: 0.8;
      }

      /* CARD */
      .box {
        max-width: 900px;
        margin: 20px auto;
        background: var(--card);
        padding: 20px;
        border-radius: 12px;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
      }

      button {
        background: var(--primary);
        color: #000;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      #seatBox {
        display: none;
      }

      /* SEAT MAP */
      .seat-map-wrapper {
        overflow-x: auto;
        padding: 10px 0;
      }

      .seat-map {
        display: grid;
        gap: 8px;
        justify-content: center;
        margin: auto;
      }

      .seat {
        width: 44px;
        height: 44px;
        background: var(--seat);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      .seat.booked {
        background: var(--danger);
        cursor: not-allowed;
      }

      .seat.selected {
        background: var(--selected);
      }

      .aisle {
        width: 44px;
        height: 44px;
        background: transparent;
      }

      .stage {
        background: linear-gradient(135deg, #334155, #1e293b);
        text-align: center;
        padding: 14px;
        border-radius: 10px;
        margin: 15px 0 20px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .app-header {
        background: linear-gradient(135deg, #003f33, #005c46);
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        border-bottom: 2px solid #facc15;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .title {
        font-size: 18px;
        font-weight: 600;
        white-space: nowrap;
      }

      .seat.vip {
        background: linear-gradient(135deg, #facc15, #eab308);
        border: 2px solid #b45309;
        color: #000;
        font-weight: bold;
      }

      .seat.mine {
        background: #3b82f6; /* biru */
        color: white;
        border: 2px solid #1d4ed8;
        font-weight: bold;
        cursor: not-allowed;
      }

      @media (max-width: 480px) {
        .title {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <header class="app-header">
      <div class="header-left">
        <img
          src="assets/logo_gold.png"
          alt="Logo Tunas Mekar Indonesia"
          class="logo"
        />
        <span class="title">Theater Seat Booking System</span>
      </div>
    </header>

    <!-- LOGIN -->
    <div id="loginBox" class="box">
      <h2>Login</h2>

      <select id="level">
        <option value="">-- Pilih Level --</option>
        <option value="ECC">ECC</option>
        <option value="ES">ES</option>
        <option value="JHS">JHS</option>
        <option value="SHS">SHS</option>
      </select>

      <input id="username" placeholder="Username" />
      <input id="password" type="password" placeholder="Password" />

      <button onclick="login()">Login</button>
    </div>

    <!-- SEAT -->
    <div id="seatBox" class="box">
      <h2>Pilih Kursi</h2>
      <div id="userInfo"></div>

      <!-- STAGE -->
      <div class="stage">🎤 STAGE / PODIUM</div>

      <!-- SEAT MAP -->
      <div class="seat-map-wrapper">
        <div id="seatMap" class="seat-map"></div>
      </div>

      <button onclick="submitSeats()">Booking Kursi</button>
    </div>

    <footer>© <span>2026</span> Mr Rayhan. All rights reserved.</footer>

    <script>
      const WEBAPP_URL =
        "https://script.google.com/macros/s/AKfycbw8X8JhBfjfvNgWBE0QnlNdodmkWTqp_gaNJa2pTLh-pQ0dcqUjri3MJWcarBTsWdI5/exec";

      let userData = null;
      let selectedSeats = [];
      let config = {};

      /* LOGIN */
      async function login() {
        const levelEl = document.getElementById("level");
        const usernameEl = document.getElementById("username");
        const passwordEl = document.getElementById("password");

        const level = levelEl.value;
        const username = usernameEl.value.trim();
        const password = passwordEl.value.trim();

        if (!level || !username || !password) {
          alert("Level, username, dan password wajib diisi");
          return;
        }

        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "login",
            level,
            username,
            password,
          }),
        });

        const data = await res.json();

        if (!data.success) {
          alert(data.message || "Login gagal");
          return;
        }

        userData = data;

        document.getElementById("loginBox").style.display = "none";
        document.getElementById("seatBox").style.display = "block";

        document.getElementById(
          "userInfo"
        ).innerText = `${data.fullname} | Max Seat: ${data.max_seat}`;

        await loadConfig();
        loadSeats();
      }

      /* LOAD CONFIG */
      async function loadConfig() {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "config" }),
        });
        config = await res.json();
      }

      function isVIP(rowLabel, colNumber) {
        if (!config.VIP_ROWS || !config.VIP_COLUMNS) return false;
        return (
          config.VIP_ROWS.includes(rowLabel) &&
          config.VIP_COLUMNS.includes(colNumber)
        );
      }

      /* LOAD SEATS */
      async function loadSeats() {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "seatmap" }),
        });

        const booked = await res.json();
        const seatMap = document.getElementById("seatMap");

        const rows = parseInt(config.ROWS);
        const cols = parseInt(config.COLUMNS);
        const aisle = parseInt(config.AISLE_COLUMN);

        seatMap.style.gridTemplateColumns = `repeat(${cols}, 44px)`;
        seatMap.innerHTML = "";

        for (let r = 0; r < rows; r++) {
          const rowLetter = String.fromCharCode(65 + r);

          for (let c = 1; c <= cols; c++) {
            if (c === aisle) {
              const aisleEl = document.createElement("div");
              aisleEl.className = "aisle";
              seatMap.appendChild(aisleEl);
              continue;
            }

            const realCol = c > aisle ? c - 1 : c;
            const seatCode = rowLetter + realCol;

            const seat = document.createElement("div");
            seat.className = "seat";
            seat.innerText = seatCode;

            // ⭐ VIP CHECK
            if (isVIP(rowLetter, realCol)) {
              seat.classList.add("vip");
              seat.innerText = "⭐";
              seat.title = seatCode + " (VIP)";
            }

            // BOOKED CHECK
            if (booked[seatCode]) {
              // kursi sudah dibooking
              if (booked[seatCode].username === userData.username) {
                // ⭐ kursi milik user sendiri
                seat.classList.add("mine");
                seat.title = "Kursi kamu: " + seatCode;
              } else {
                // kursi milik orang lain
                seat.classList.add("booked");
                seat.title = "Sudah dibooking";
              }
            } else {
              seat.onclick = () => toggleSeat(seatCode, seat);
            }

            seatMap.appendChild(seat);
          }
        }
      }

      /* TOGGLE */
      function toggleSeat(code, el) {
        if (selectedSeats.includes(code)) {
          selectedSeats = selectedSeats.filter((s) => s !== code);
          el.classList.remove("selected");
          return;
        }

        if (selectedSeats.length >= userData.max_seat) {
          alert("Maksimal kursi: " + userData.max_seat);
          return;
        }

        selectedSeats.push(code);
        el.classList.add("selected");
      }

      /* SUBMIT */
      async function submitSeats() {
        const res = await fetch(WEBAPP_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "book",
            level: userData.level,
            username: userData.username,
            seats: selectedSeats,
          }),
        });

        const data = await res.json();
        if (!data.success) return alert(data.message);

        alert("Berhasil booking!");
        location.reload();
      }
    </script>
  </body>
</html>
